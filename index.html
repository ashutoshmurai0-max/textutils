<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TextUtils</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: linear-gradient(135deg, #2b0a3d, #0a2a3d);
    color: white;
    text-align: center;
    padding: 50px 20px;
  }
  h1 {
    color: #6be0e0;
    font-size: 2.5rem;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid #7d5fff;
    border-radius: 12px;
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
  }
  textarea {
    width: 95%;
    height: 150px;
    background: rgba(0,0,0,0.3);
    border: 1px solid #7d5fff;
    border-radius: 8px;
    color: white;
    padding: 10px;
    font-size: 1rem;
  }
  .buttons {
    margin-top: 15px;
  }
  button {
    background: #7d5fff;
    color: white;
    border: none;
    padding: 10px 18px;
    margin: 5px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  button:hover {
    background: #6a4be0;
  }
</style>
</head>
<body>

<h1>TextUtils</h1>

<div class="card">
  <h3 style="text-align:left;">Enter Your Text</h3>
  <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
  <div class="buttons">
    <button onclick="toUpper()">UPPERCASE</button>
    <button onclick="toLower()">lowercase</button>
    <button onclick="capitalize()">Capitalize</button>
    <button onclick="removeSpaces()">Remove Spaces</button>
    <button onclick="copyText()">Copy Text</button>
    <button onclick="clearText()">Clear Text</button>
  </div>
</div>

<script>
  const textInput = document.getElementById("textInput");

  function toUpper() {
    textInput.value = textInput.value.toUpperCase();
  }

  function toLower() {
    textInput.value = textInput.value.toLowerCase();
  }

  function capitalize() {
    textInput.value = textInput.value
      .toLowerCase()
      .split(" ")
      .map(word => word.charAt(0).toUpperCase() + word.slice(1))
      .join(" ");
  }

  function removeSpaces() {
    textInput.value = textInput.value.replace(/\s+/g, " ").trim();
  }

  function copyText() {
    navigator.clipboard.writeText(textInput.value);
    alert("Text copied!");
  }

  function clearText() {
    textInput.value = "";
  }
</script>

</body>
</html>
